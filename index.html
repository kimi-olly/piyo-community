<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">

<title>Piyo</title>
<style>
:root{--g:#58cc02;--gd:#46a302;--gl:#e9f9d6;--tx:#3c3c3c;--mu:#777;--bd:#e5e5e5;--or:#ff9600;--bl:#1cb0f6;--bld:#1899d6;--ye:#ffd33d}
*{box-sizing:border-box}
body{margin:0;background:#f7f7f7;color:var(--tx);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;line-height:1.5}
header{background:#fff;border-bottom:2px solid var(--bd);position:sticky;top:0;z-index:5}
.hin{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:22px;color:var(--g);display:flex;gap:8px;align-items:center;letter-spacing:.5px}
.lang{border:2px solid var(--bd);border-bottom-width:4px;background:#fff;border-radius:12px;padding:5px 10px;font-weight:800;font-size:13px;cursor:pointer;color:var(--mu);font-family:inherit}
.lang b{color:var(--bld)}
.lang:active{transform:translateY(2px);border-bottom-width:2px}
:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
main{max-width:980px;margin:0 auto;padding:18px 16px 60px}
.narrow{max-width:520px;margin:0 auto}
h1{font-size:24px;margin:6px 0 4px}
.sub{color:var(--mu);font-size:14px;margin:0 0 18px}
.hero{text-align:center}
.hero svg{width:110px;height:104px}
.bounce{animation:bn 2.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bn{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px) scale(1.02)}}
.card{background:#fff;border:2px solid var(--bd);border-bottom-width:4px;border-radius:18px;padding:14px 16px;margin-bottom:14px;width:100%;text-align:left;font-family:inherit;color:inherit;font-size:15px}
button.card{cursor:pointer;display:flex;gap:14px;align-items:center}
button.card:hover{background:#fafafa}
button.card:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:16px}
button.card.sel{border-color:var(--bl);background:#ddf4ff;border-bottom-color:var(--bld)}
.card .ic{font-size:32px}
.card b{display:block;font-size:16px}
.card small{color:var(--mu);font-size:13px}
.btn{display:block;width:100%;background:var(--g);color:#fff;border:0;border-bottom:5px solid var(--gd);border-radius:16px;padding:13px;font-weight:800;font-size:16px;letter-spacing:.5px;cursor:pointer;font-family:inherit;text-transform:uppercase}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn:disabled{background:var(--bd);border-bottom-color:#cfcfcf;color:#aaa;cursor:not-allowed}
.btn.blue{background:var(--bl);border-bottom-color:var(--bld)}
.btn.ghost{background:#fff;color:var(--bld);border:2px solid var(--bd);border-bottom-width:4px}
.btn.sm{display:inline-block;width:auto;padding:9px 14px;font-size:13px}
.row{display:flex;gap:10px}.row>*{flex:1}
.pbar{height:14px;background:var(--bd);border-radius:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--g);border-radius:8px;transition:width .5s}
.pbar.b i{background:var(--bl)}
.qtop{font-size:13px;color:var(--mu);font-weight:700;margin-bottom:6px}
.exname{font-size:20px;font-weight:800}
.tag{display:inline-block;background:var(--gl);color:var(--gd);font-weight:800;font-size:12px;border-radius:10px;padding:2px 8px;margin-bottom:6px}
ul.rules{margin:8px 0 0;padding:0;list-style:none}
ul.rules li{padding:8px 0;border-top:2px solid #f0f0f0;font-size:14px;display:flex;gap:8px}
.grid{display:grid;gap:0 18px}
@media(min-width:860px){.grid{grid-template-columns:1fr 1fr;align-items:start}}
.stats{display:flex;justify-content:space-between;font-weight:800;font-size:16px;margin-bottom:10px}
.streak{color:var(--or)}.xpn{color:var(--g)}
.chickcard{text-align:center;position:relative}
.chickcard svg{width:150px;height:142px}
.bub{display:inline-block;border:2px solid var(--bd);border-radius:14px;padding:8px 14px;font-size:14px;font-weight:700;margin:2px 0 8px;background:#fff;position:relative}
.role{font-weight:800;font-size:18px}
.role span{color:var(--gd)}
.pop{position:absolute;right:18%;top:70px;font-weight:800;font-size:22px;color:var(--g);animation:pop 1.2s ease-out forwards;pointer-events:none}
@keyframes pop{0%{opacity:0;transform:translateY(10px) scale(.6)}25%{opacity:1;transform:translateY(-6px) scale(1.2)}100%{opacity:0;transform:translateY(-44px)}}
.banner{border-radius:14px;padding:10px 14px;font-weight:800;margin-bottom:14px;animation:slide .4s}
.banner.up{background:var(--gl);color:var(--gd);border:2px solid var(--g)}
.banner.soft{background:#ddf4ff;color:var(--bld);border:2px solid var(--bl)}
.banner.info{background:#fff4d6;color:#b36b00;border:2px solid var(--ye)}
@keyframes slide{from{opacity:0;transform:translateY(-8px)}}
h2{font-size:16px;margin:0 0 10px}
.task{display:flex;justify-content:space-between;align-items:center;width:100%;border:2px solid var(--bd);border-bottom-width:4px;border-radius:14px;padding:10px 14px;margin-bottom:8px;background:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--tx);text-align:left}
.task b{color:var(--g);white-space:nowrap}
.task:hover{background:#fafafa}
.task:active:not(.done){transform:translateY(2px);border-bottom-width:2px;margin-bottom:10px}
.task.done{background:var(--gl);border-color:#b8e986;color:var(--gd);cursor:default}
.linkbox{background:#f4f4f4;border-radius:10px;padding:8px 10px;font-size:13px;word-break:break-all;margin:10px 0 0;font-family:ui-monospace,monospace}
.ladder{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;margin-bottom:6px;font-size:14px}
.ladder.cur{background:var(--gl);border:2px solid var(--g)}
.ladder.lock{opacity:.55}
.ladder .e{font-size:24px}
.ladder small{color:var(--mu);display:block}
.friends{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.fr{background:#f7f7f7;border-radius:12px;padding:4px 10px;font-size:13px;font-weight:700}
.muted{color:var(--mu);font-size:13px}
.inp{width:100%;border:2px solid var(--bd);border-bottom-width:4px;border-radius:14px;padding:12px 14px;font-size:16px;font-family:inherit;color:var(--tx);background:#fff}
.inp:focus{border-color:var(--bl);outline:none}
.tabs{display:flex;gap:6px;margin:4px 0 12px}
.tab{flex:1;border:2px solid var(--bd);border-bottom-width:4px;background:#fff;border-radius:12px;padding:8px 4px;font-weight:800;font-size:14px;font-family:inherit;color:var(--mu);cursor:pointer}
.tab.on{background:#ddf4ff;border-color:var(--bl);color:var(--bld)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:2px solid var(--bd);background:#fff;border-radius:20px;padding:5px 10px;font-size:13px;font-weight:700;font-family:inherit;color:var(--mu);cursor:pointer}
.chip small{font-weight:700;margin-left:2px}
.chip.on{background:var(--gl);border-color:var(--g);color:var(--gd)}
.fi{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:2px solid #f0f0f0;flex-wrap:wrap}
.fi>div{flex:1;min-width:0}
.fi b{display:block;font-size:14px}
.fi small{color:var(--mu);font-size:12px;display:block}
.sb{width:38px;height:38px;border-radius:12px;background:#f4f4f4;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;font-weight:800;font-size:13px}
.sb.dt{background:#ddf4ff;color:var(--bld)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

 const el=e.target.closest("[data-act]");if(!el||el.disabled)return;
 const a=el.dataset.act;
 if(a==="lang"){lang=lang==="ja"?"en":"ja";try{localStorage.setItem("lang",lang)}catch(x){}
  if(banner)banner=null;hubMsg=null;render();return}
 if(a==="name")return;
 if(a==="pet"){S.pet=el.dataset.v;banner={c:"up",m:t("pet_msg",t("pet_"+S.pet))};pop=0;save();render(true);return}
 if(a==="rename"){if(editName&&!(S.name||"").trim())S.name="";editName=!editName;save();render(true);return}
 if(a==="tab"){S.tab=el.dataset.v;hubMsg=null;save();render(true);return}
 if(a==="conn"){const k=el.dataset.v;S.conn[k]=S.conn[k]?0:1;hubMsg=t(S.conn[k]?"conn_msg_on":"conn_msg_off",SRC[k][1]);save();render(true);return}
 if(a==="sync"){const cs=Object.keys(SRC).filter(k=>S.conn[k]);
  if(!cs.length)hubMsg=t("sync_none");
  else{const n=FEED.filter(i=>i[5]&&S.conn[i[0]]&&!S.synced).length;S.synced=true;hubMsg=t("sync_msg",n)}
  save();render(true);return}
 if(a==="pub"){const cs=Object.keys(SRC).filter(k=>S.conn[k]);
  if(!cs.length)hubMsg=t("sync_none");else{S.pub[el.dataset.v]=1;hubMsg=t("ev_msg",cs.length)}
  save();render(true);return}
 if(a==="tpl"){S.tpl=el.dataset.v}
 else if(a==="ans"){S.ans[el.dataset.k]=el.dataset.v}
 else if(a==="go"){S.step=ORDER[ORDER.indexOf(S.step)+1]}
